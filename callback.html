<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla login done</title>
<body style="font-family:system-ui;padding:24px;max-width:600px">
<h2>Tesla sign-in complete</h2><p>Copy this whole code and paste it back to Tesla Bot:</p>
<textarea id="c" style="width:100%;height:120px;font-size:16px" readonly></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('c').value)" style="font-size:18px;padding:10px 16px;margin-top:8px">Copy code</button>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||('No code found. '+(p.get('error_description')||p.get('error')||''));</script>
